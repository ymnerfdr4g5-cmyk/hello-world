<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>عبدالحكيم | GitHub Pages</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #00eaff;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: #00eaff;
            color: #000;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>عبدالحكيم</h1>
        <h2>مشروع GitHub Pages</h2>

        <p>
            هذه صفحة ويب بسيطة تم إنشاؤها كجزء من التكليف.<br>
            الهدف هو تجربة الاستضافة باستخدام GitHub Pages.
        </p>

        <div class="badge">Hello World 🌍</div>

        <footer>
            © 2026 - تم النشر بنجاح
        </footer>
    </div>

</body>
</html>
